name: Build

on:
  push:
    branches: [main]
    # Pushing a version tag (e.g. v1.0.0) also publishes a GitHub release with the DLLs attached.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: sh build.sh build

      - name: Test
        run: sh build.sh test

      - name: Package
        run: sh build.sh package

      - name: Upload DLLs
        uses: actions/upload-artifact@v7
        with:
          name: keel-${{ github.run_number }}
          path: artifacts/delivery/
          if-no-files-found: error

  # Pushes to main refresh the rolling "latest-build" pre-release.
  # Pushing a v* tag publishes a permanent release for that version.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release update at a time, so two quick pushes can't race on the same release.
    concurrency:
      group: release-${{ github.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}

    steps:
      - name: Download DLLs
        uses: actions/download-artifact@v8
        with:
          name: keel-${{ github.run_number }}
          path: delivery

      - name: Zip one archive per framework
        run: |
          for dir in delivery/*/; do
            framework=$(basename "$dir")
            framework=${framework#release_}
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/keel-$RELEASE_NAME-$framework.zip" .)
          done
          ls -l keel-*.zip

      - name: Publish versioned release
        if: github.ref_type == 'tag'
        run: |
          # The release may already exist if it was created by hand on GitHub; then just attach the files.
          if gh release view "$RELEASE_NAME" > /dev/null 2>&1; then
            gh release upload "$RELEASE_NAME" keel-*.zip --clobber
          else
            gh release create "$RELEASE_NAME" keel-*.zip --title "$RELEASE_NAME" --generate-notes
          fi

      - name: Refresh latest build
        if: github.ref_type == 'branch'
        run: |
          # Recreate the pre-release so its tag moves to the commit that was just built.
          gh release delete "$RELEASE_NAME" --cleanup-tag --yes 2> /dev/null || true
          gh release create "$RELEASE_NAME" keel-*.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build" \
            --notes "Built automatically from the newest commit on main: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA

          This build is replaced on every push. For something stable to depend on, use a numbered release."
