name: Build

on:
  push:
    branches: [main]
    # Pushing a version tag (e.g. v1.0.0) also publishes a GitHub release with the DLLs attached.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: sh build.sh build

      - name: Test
        run: sh build.sh test

      - name: Package
        run: sh build.sh package

      - name: Upload DLLs
        uses: actions/upload-artifact@v7
        with:
          name: keel-${{ github.run_number }}
          path: artifacts/delivery/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download DLLs
        uses: actions/download-artifact@v8
        with:
          name: keel-${{ github.run_number }}
          path: delivery

      - name: Zip one archive per framework
        run: |
          for dir in delivery/*/; do
            framework=$(basename "$dir")
            framework=${framework#release_}
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/keel-$GITHUB_REF_NAME-$framework.zip" .)
          done
          ls -l keel-*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist if it was created by hand on GitHub; then just attach the files.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" keel-*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" keel-*.zip --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
